[project]
name = "churn-prediction"
version = "1.0.0"
description = "Предсказание оттока клиентов в банке"
authors = [
    {name = "Харлов Максим"},
    {name = "Масликов Павел"},
    ]


readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
